<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSRS 单词背诵 MVP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { max-width: 600px; margin: 80px auto; padding: 0 20px; }
        .card { border: 1px solid #eee; border-radius: 12px; padding: 40px 20px; text-align: center; box-shadow: 0 2px 8px #f0f0f0; }
        .word { font-size: 28px; font-weight: bold; margin-bottom: 16px; }
        .translation { font-size: 20px; color: #666; margin-bottom: 30px; min-height: 28px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .again { background: #ff4d4f; color: #fff; }
        .hard { background: #ff7a45; color: #fff; }
        .good { background: #52c41a; color: #fff; }
        .easy { background: #1890ff; color: #fff; }
        .tip { margin-top: 20px; color: #999; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="word" id="word">加载中...</div>
        <div class="translation" id="translation"></div>
        <div class="btn-group">
            <button class="again" onclick="rateCard(1)">Again</button>
            <button class="hard" onclick="rateCard(2)">Hard</button>
            <button class="good" onclick="rateCard(3)">Good</button>
            <button class="easy" onclick="rateCard(4)">Easy</button>
        </div>
    </div>
    <div class="tip" id="tip"></div>

    <script src="fsrs.js"></script>
    <script>
        let wordList = [];
        let currentWord = null;
        let fsrs = new FSRS();

        async function loadWords() {
            try {
                const res = await fetch("words.json");
                wordList = await res.json();
                initProgress();
                pickNextCard();
            } catch (e) {
                document.getElementById("word").innerText = "加载单词失败";
                console.error("加载words.json错误:", e);
            }
        }

        function initProgress() {
            if (!localStorage.getItem("fsrs_words_progress")) {
                const initData = wordList.map(item => ({
                    id: item.id,
                    word: item.word,
                    translation: item.translation,
                    card: fsrs.createCard()
                }));
                localStorage.setItem("fsrs_words_progress", JSON.stringify(initData));
            }
        }

        function getReviewCards() {
            const now = new Date();
            const allCards = JSON.parse(localStorage.getItem("fsrs_words_progress"));
            return allCards.filter(item => new Date(item.card.due) <= now);
        }

        function pickNextCard() {
            const reviewList = getReviewCards();
            const tipDom = document.getElementById("tip");

            if (reviewList.length === 0) {
                document.getElementById("word").innerText = "今日复习完成！";
                document.getElementById("translation").innerText = "";
                tipDom.innerText = "暂无需要复习的单词";
                document.querySelector(".btn-group").style.display = "none";
                return;
            }

            document.querySelector(".btn-group").style.display = "flex";
            currentWord = reviewList[0];
            document.getElementById("word").innerText = currentWord.word;
            document.getElementById("translation").innerText = currentWord.translation;
            tipDom.innerText = `剩余待复习：${reviewList.length}`;
        }

        function rateCard(rating) {
            if (!currentWord) return;
            const now = new Date();
            const results = fsrs.repeat(currentWord.card, now);
            // 修复核心错误：直接取对应卡片，不再解构
            const newCard = results[rating - 1];
            currentWord.card = newCard;

            const allData = JSON.parse(localStorage.getItem("fsrs_words_progress"));
            const idx = allData.findIndex(d => d.id === currentWord.id);
            if (idx > -1) allData[idx] = currentWord;
            localStorage.setItem("fsrs_words_progress", JSON.stringify(allData));

            pickNextCard();
        }

        loadWords();
    </script>
</body>
</html>
